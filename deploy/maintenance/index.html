<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta http-equiv="refresh" content="15" />
    <title>Back in a minute · Hack Day Hamirpur</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;

          ui-sans-serif,
