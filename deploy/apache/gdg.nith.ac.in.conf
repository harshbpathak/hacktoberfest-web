# gdg.nith.ac.in -> Docker container on 127.0.0.1:3000
# Installed by deploy/server-setup.sh. HTTPS uses the institute's existing *.nith.ac.in
# certificate (same files as the TPO site; it expires 10 Dec 2026 and CC renews it).

<VirtualHost *:80>
    ServerName gdg.nith.ac.in
    ServerAlias hacktoberfest.gdg.nith.ac.in
    Redirect permanent / https://gdg.nith.ac.in/
</VirtualHost>

<VirtualHost *:443>
    ServerName gdg.nith.ac.in

    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/nith.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/nith.ac.in.key
    SSLCertificateChainFile /etc/apache2/ssl/intermediate.crt

    # Shown when Apache can't reach the container (deploy restart or outage)
    Alias /_maintenance/ /var/www/hacktoberfest-maintenance/
    <Directory /var/www/hacktoberfest-maintenance>
        Require all granted
    </Directory>
    ErrorDocument 502 /_maintenance/index.html
    ErrorDocument 503 /_maintenance/index.html

    ProxyPreserveHost On
    ProxyPass        /_maintenance/ !
    ProxyPass        / http://127.0.0.1:3000/ retry=0 connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/gdg-error.log
    CustomLog ${APACHE_LOG_DIR}/gdg-access.log combined
</VirtualHost>
