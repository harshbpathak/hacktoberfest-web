# gdg.nith.ac.in (and hacktoberfest.gdg.nith.ac.in once CC adds it) -> container on 127.0.0.1:3000
# Installed by deploy/server-setup.sh. HTTPS is added afterwards by certbot (--apache), which
# copies this block into a :443 virtual host and redirects port 80 to HTTPS.
<VirtualHost *:80>
    ServerName gdg.nith.ac.in
    ServerAlias hacktoberfest.gdg.nith.ac.in

    # Shown when Apache can't reach the container (deploy restart or outage)
    Alias /_maintenance/ /var/www/hacktoberfest-maintenance/
    <Directory /var/www/hacktoberfest-maintenance>
        Require all granted
    </Directory>
    ErrorDocument 502 /_maintenance/index.html
    ErrorDocument 503 /_maintenance/index.html

    ProxyPreserveHost On
    ProxyPass        /_maintenance/ !
    ProxyPass        / http://127.0.0.1:3000/ retry=0 connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:3000/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # Compress only if mod_deflate is already enabled on this server (setup doesn't enable it)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/hacktoberfest-error.log
    CustomLog ${APACHE_LOG_DIR}/hacktoberfest-access.log combined
</VirtualHost>
